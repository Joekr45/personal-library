services:
  personal-library:
    image: ghcr.io/joekr45/personal-library:latest
    container_name: personal-library
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      - TZ=America/New_York
    volumes:
      # Left side: folder on the Unraid server. Right side: where the app saves data inside the container.
      - /mnt/user/appdata/personal-library:/data
